<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GTA Mistral City</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI",Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;position:fixed;inset:0}
  .tbtn{position:fixed;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;letter-spacing:.5px;z-index:10;-webkit-tap-highlight-color:transparent}
  .tbtn:active{background:rgba(255,255,255,.30)}
  #btnFire{width:88px;height:88px;right:22px;bottom:96px;background:rgba(220,40,40,.35);border-color:rgba(255,120,120,.6)}
  #btnEnter{width:74px;height:74px;right:120px;bottom:24px;background:rgba(40,120,220,.35);border-color:rgba(120,190,255,.6);font-size:12px}
  #stickZone{position:fixed;left:0;bottom:0;width:45%;height:55%;z-index:9}
  #stick{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);display:none;z-index:11;pointer-events:none}
  #knob{position:absolute;width:52px;height:52px;left:32px;top:32px;border-radius:50%;background:rgba(255,255,255,.35)}
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.82);color:#fff;z-index:20;text-align:center;padding:20px}
  #intro h1{font-size:clamp(30px,7vw,64px);margin:0 0 10px;color:#ffd23c;text-shadow:3px 3px 0 #802;font-style:italic}
  #intro p{max-width:560px;line-height:1.6;color:#ddd;font-size:14px}
  #intro b{color:#8cf}
  #startBtn{margin-top:22px;padding:14px 44px;font-size:20px;font-weight:800;background:#ffd23c;border:0;border-radius:10px;cursor:pointer;color:#222}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="stickZone"></div>
<div id="stick"><div id="knob"></div></div>
<div id="btnFire" class="tbtn">PAL</div>
<div id="btnEnter" class="tbtn">WYSIĄDŹ</div>
<div id="intro">
  <h1>GTA MISTRAL CITY</h1>
  <p><b>WASD / strzałki</b> – ruch i jazda &nbsp;•&nbsp; <b>SPACJA</b> – strzał (auto-aim) &nbsp;•&nbsp; <b>E</b> – wsiądź / wysiądź<br>
  Na dotyku: joystick po lewej, przyciski po prawej.<br>
  Zbieraj <b style="color:#7f7">$</b>, wykonuj <b style="color:#ff0">misje kurierskie</b>, ale uważaj na <b style="color:#faa">policję (5 gwiazdek)</b>!</p>
  <button id="startBtn">GRAJ</button>
</div>
<script>
(() => {
"use strict";

/* ============================ UTILS ============================ */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const dist2 = (ax,ay,bx,by) => {const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const dist = (ax,ay,bx,by) => Math.sqrt(dist2(ax,ay,bx,by));
const lerp = (a,b,t) => a+(b-a)*t;
function angLerp(a,b,t){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return a+d*t;}
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20250901);
function hash1(a,b,c){const x=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return x-Math.floor(x);}

/* ============================ WORLD ============================ */
const BLOCKS = 10, ROAD = 92, BLOCK = 232, PITCH = ROAD+BLOCK;
const WORLD = BLOCKS*PITCH + ROAD;
const SIDEWALK = 20;

const buildings = [];
const buildingsByBlock = [];
for(let i=0;i<BLOCKS;i++){buildingsByBlock[i]=[];for(let j=0;j<BLOCKS;j++)buildingsByBlock[i][j]=[];}

const palette = ["#b8a186","#a9a9a2","#9aa5a8","#b58f7a","#8f9c86","#a595b0","#b0b0a4","#97826f"];
for(let i=0;i<BLOCKS;i++)for(let j=0;j<BLOCKS;j++){
  const bx=i*PITCH+ROAD, by=j*PITCH+ROAD;
  const m=SIDEWALK+8;
  const x0=bx+m, y0=by+m, w=BLOCK-2*m, h=BLOCK-2*m;
  const parts=[];
  if(rnd()<0.62){
    const vertSplit = rnd()<0.5;
    if(vertSplit){
      const x1=x0+w*(0.35+rnd()*0.3);
      parts.push([x0,y0,x1-x0,h],[x1,y0,x0+w-x1,h]);
    }else{
      const y1=y0+h*(0.35+rnd()*0.3);
      parts.push([x0,y0,w,y1-y0],[x0,y1,w,y0+h-y1]);
    }
  } else parts.push([x0,y0,w,h]);
  if(rnd()<0.5 && parts.length===2){
    const p=parts[0];
    parts[0]=[p[0],p[1],p[2],p[3]*(0.4+rnd()*0.35)];
    parts.push([p[0],p[1]+parts[0][3],p[2],p[3]-parts[0][3]]);
  }
  for(const [px,py,pw,ph] of parts){
    if(pw<34||ph<34)continue;
    const b={x:px,y:py,w:pw,h:ph,
      hgt:26+rnd()*rnd()*120,
      col:palette[(rnd()*palette.length)|0]};
    buildings.push(b);buildingsByBlock[i][j].push(b);
  }
}
function blockOf(x,y){return[clamp(Math.floor((x-ROAD)/PITCH),0,BLOCKS-1),clamp(Math.floor((y-ROAD)/PITCH),0,BLOCKS-1)];}
function collideBuildings(e,r){
  const[bi,bj]=blockOf(e.x,e.y);
  for(let i=Math.max(0,bi-0);i<=Math.min(BLOCKS-1,bi+0);i++)
  for(let j=Math.max(0,bj-0);j<=Math.min(BLOCKS-1,bj+0);j++)
  for(const b of buildingsByBlock[i][j]){
    const cx=clamp(e.x,b.x,b.x+b.w),cy=clamp(e.y,b.y,b.y+b.h);
    const dx=e.x-cx,dy=e.y-cy,d2=dx*dx+dy*dy;
    if(d2<r*r){
      if(d2>0.0001){const d=Math.sqrt(d2);e.x=cx+dx/d*r;e.y=cy+dy/d*r;}
      else{e.x=b.x+b.w+r;}
      return true;
    }
  }
  return false;
}
const isRoad = (x,y) => x>=0&&y>=0&&x<WORLD&&y<WORLD&&((x%PITCH)<ROAD||(y%PITCH)<ROAD);

/* ============================ STATE ============================ */
const player={x:0,y:0,angle:0,speed:0,vx:0,vy:0,hp:100,money:250,car:null,
  fireT:0,inv:3,dead:false,deadT:0,onFootWalk:0};
player.x=player.y=WORLD/2;
const cars=[],peds=[],bullets=[],pickups=[],parts=[],splats=[];
let heat=0,lastCrime=-99,copSpawnT=0,gameT=0,deliveries=0;
let cam={x:player.x,y:player.y},zoom=1;
const DAY_LEN=270;
let mission=null;
let missionsTouched=0;
let started=false;

/* mission marker = start point of courier missions */
const missionStart={x:WORLD/2+330,y:WORLD/2-140};
function randRoadPoint(cx,cy,rad){
  for(let t=0;t<60;t++){
    const a=rndTAU(),d=200+rnd()*(rad||900);
    let x=clamp(cx+Math.cos(a)*d,ROAD,ROAD+WORLD-2*ROAD),y=clamp(cy+Math.sin(a)*d,ROAD,ROAD+WORLD-2*ROAD),road=isRoad(x,y);
    if(road)return{x,y};
  }
  return{x:WORLD/2,y:WORLD/2};
}
function randSidewalkPoint(cx,cy,rad){
  for(let t=0;t<80;t++){
    const p=randRoadPoint(cx,cy,rad);
    const fx=p.x%PITCH,fy=p.y%PITCH;
    let nx=p.x,ny=p.y;
    if(fx<ROAD&&fy<ROAD){
      const s=rnd()<0.5?
        {x:0,y:(fy<ROAD/2?-1:1)*SIDEWALK/2}:{x:(fx<ROAD/2?-1:1)*SIDEWALK/2,y:0};
      nx=clamp(p.x+s.x,10,WORLD-10);ny=clamp(p.y+s.y,10,WORLD-10);
      if(collideBuildings({x:nx,y:ny},10))continue;
      return{nx,ny};
    }
    else if(fx<ROAD){ny=clamp(p.y+(fy<ROAD/2?-SIDEWALK/2:SIDEWALK/2),0,WORLD);}
    else{nx=clamp(p.x+(fx<ROAD/2?-SIDEWALK/2:SIDEWALK/2),0,WORLD);}
    if(!collideBuildings({x:nx,y:ny},10))
      return{nx:clamp(nx,10,WORLD-10),ny:clamp(ny,10,WORLD-10)};
  }
  return{nx:WORLD/2,ny:WORLD/2};
}
function rndTAU(){return rnd()*TAU;}

/* ============================ INPUT ============================ */
const keys={};
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
addEventListener('keydown',e=>{keys[e.code]=true;
  if(e.code==='KeyE'&&!e.repeat)toggleCar();
  if(e.code==='Space')e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
let mouse={x:0,y:0,down:false,active:false};
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;});
addEventListener('mousedown',e=>{if(e.target===cvs)mouse.down=true;});
addEventListener('mouseup',()=>mouse.down=false);
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cvs.width=innerWidth*DPR;H=cvs.height=innerHeight*DPR;cvs.style.width=innerWidth+'px';cvs.style.height=innerHeight+'px';zoom=clamp(Math.min(innerWidth,innerHeight)/760,0.72,1.25);}
addEventListener('resize',resize);resize();

const isTouch=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
const touch={active:false,mx:0,my:0,fire:false,enterQueued:false};
const stickZ=document.getElementById('stickZone'),stickEl=document.getElementById('stick'),knob=document.getElementById('knob');
let stickId=null,ox=0,oy=0;
stickZ.addEventListener('pointerdown',e=>{if(stickId===null){stickId=e.pointerId;ox=e.clientX;oy=e.clientY;stickEl.style.display='block';moveStick(e.clientX,e.clientY);}});
addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e.clientX,e.clientY);});
addEventListener('pointerup',e=>{if(e.pointerId===stickId){stickId=null;touch.active=false;stickEl.style.display='none';touch.mx=touch.my=0;}});
addEventListener('pointercancel',e=>{if(e.pointerId===stickId){stickId=null;touch.active=false;stickEl.style.display='none';}});
function moveStick(cx,cy){
  touch.active=true;
  let dx=cx-ox,dy=cy-oy;const d=Math.hypot(dx,dy),max=52;
  if(d>max){dx=dx/d*max;dy=dy/d*max;ox=cx-dx;oy=cy-dy;}
  stickEl.style.left=ox+'px';stickEl.style.top=oy+'px';
  knob.style.left=(32+dx)+'px';knob.style.top=(32+dy)+'px';
  touch.mx=dx/max;touch.my=dy/max;
}
const btnFire=document.getElementById('btnFire'),btnEnter=document.getElementById('btnEnter');
btnFire.addEventListener('pointerdown',e=>{e.preventDefault();touch.fire=true;});
btnFire.addEventListener('pointerup',()=>touch.fire=false);
btnFire.addEventListener('pointerleave',()=>touch.fire=false);
btnEnter.addEventListener('pointerdown',e=>{e.preventDefault();toggleCar();});

/* ============================ AUDIO ============================ */
let AC=null;
function sfx(f0,f1,dur,type,vol){
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f0,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),AC.currentTime+dur);
    g.gain.setValueAtTime(vol||0.08,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}

/* ============================ SPAWNING ============================ */
const DIRX=[1,0,-1,0],DIRY=[0,1,0,-1];
function spawnCar(cop,nearPlayer){
  const p=nearPlayer?randRoadPoint(player.x,player.y,600+nearPlayer*500):randRoadPoint(player.x,player.y,900);
  if(dist(p.x,p.y,player.x,player.y)<260)return null;
  return{ // dir random along the road we found
    x:p.x,y:p.y,angle:0,speed:120+rnd()*90,max:150+rnd()*70,
    d:(rnd()<0.5?0:1)+(rnd()<0.5?0:2),car:cop?null:pal[(rnd()*pal.length)|0],
    isCop:!!cop,hp:cop?45:22,turnCd:0,dead:0,w:44,h:22,pushed:0
  };
}
const pal=["#c23b3b","#3b6bc2","#c2a23b","#3bc27a","#8a8a8a","#b06bc2","#d97b2f","#3bb0c2","#777c85","#5a4f3f"];
function fixCarDir(c){
  // snap onto nearest road centerline and lane for its direction
  const evenY=Math.floor(c.y/PITCH),exX=Math.floor(c.x/PITCH);
  const xr=c.x-exX*PITCH<ROAD, yr=c.y-evenY*PITCH<ROAD;
  if(c.d%2===0){ // x movement -> needs horizontal road
    if(!yr){c.d=(xr&&c.x<WORLD-300)?1:(c.d===0?2:0);}else{c.y=evenY*PITCH+ROAD*0.5+laneOff(c.d);}
  }else{
    if(!xr){c.d=(yr&&c.y<WORLD-300)?0:(c.d===1?3:1);}else{c.x=exX*PITCH+ROAD*0.5+laneOff(c.d);}
  }
}
function laneOff(d){return (d===0?ROAD*0.24:0)+(d===2?-ROAD*0.24:0)+(d===1?-ROAD*0.24:0)+(d===3?ROAD*0.24:0);}
// recompute properly: lane offset perpendicular to movement
function lanePerp(d){
  // moving dir d, right-hand side offset
  if(d===0)return{ax:0,off:ROAD*0.24,axis:'y'};
  if(d===2)return{ax:0,off:-ROAD*0.24,axis:'y'};
  if(d===1)return{ax:0,off:-ROAD*0.24,axis:'x'};
  return{ax:0,off:ROAD*0.24,axis:'x'};
}
for(let i=0;i<26;i++){const c=spawnCar(false,0);if(c){fixCarDir(c);cars.push(c);}}

function spawnPed(){
  for(let t=0;t<40;t++){
    const p=randSidewalkPoint(player.x,player.y,700);
    if(true){
      return{x:p.nx,y:p.ny,a:rndTAU(),col:palCol(t),spd:26+rnd()*26,t:0,dead:0,panic:0};
    }
  }
  return null;
}
const skin=["#e6c3a2","#c98d5a","#8a5a3a","#f0d0b0"];
function palCol(i){return["#c74","#36a","#a4a","#cc4","#4aa","#666","#c66","#4a6","#68c","#b72"][(i|0)%10];}
for(let i=0;i<38;i++){const p=spawnPed();if(p)peds.push(p);}
for(let i=0;i<42;i++){const p=randSidewalkPoint(player.x,player.y,1400);pickups.push({x:p.nx,y:p.ny,t:rnd()*TAU,val:50+((rnd()*5)|0)*50});}
function copsNeeded(){return Math.min(5,Math.floor(heat));}

/* ============================ ACTIONS ============================ */
function toggleCar(){
  if(player.dead)return;
  if(player.car){
    const c=player.car;c.speed*=0.4;
    player.x=c.x+Math.cos(c.angle+Math.PI/2)*34;player.y=c.y+Math.sin(c.angle+Math.PI/2)*34;
    collideBuildings(player,10);
    player.car=null;player.angle=c.angle;
  }else{
    let best=null,bd=70*70;
    for(const c of cars){if(c.dead)continue;const d=dist2(player.x,player.y,c.x,c.y);if(d<bd){bd=d;best=c;}}
    if(best){
      if(best.isCop){addHeat(1.1);}
      player.car=best;best.driven=true;
      touch.enterQueued=false;
      sfx(300,600,0.12,'sawtooth',0.05);
    }
  }
}
function addHeat(h){
  if(player.dead)return;
  heat=clamp(heat+h,0,5.99);lastCrime=gameT;
}
function fire(){
  if(player.fireT>0||player.dead)return;
  player.fireT=0.16;
  let aim=aimAngle();
  // auto-aim: pick best target within range and near aim direction
  let tw=null,ts=-1;
  const consider=(x,y,sc)=>{
    const d=dist(player.x,player.y,x,y);
    if(d>340)return;
    let da=Math.abs(((Math.atan2(y-player.y,x-player.x)-aim+Math.PI*3)%TAU)-Math.PI);
    const s=1-da+d/340*0.2;
    if(da<1.15&&s>ts&&d>2){ts=s;tw={x,y};}
  };
  for(const p of peds)if(!p.dead)consider(p.x,p.y,1);
  for(const c of cars)if(!c.dead)consider(c.x,c.y,1.05);
  if(tw)aim=Math.atan2(tw.y-player.y,tw.x-player.x)+((hash1(gameT*13|0,1,2)-0.5)*0.06);
  const sx=player.car?player.car.x:player.x,sy=player.car?player.car.y:player.y;
  bullets.push({x:sx+Math.cos(aim)*24,y:sy+Math.sin(aim)*24,dx:Math.cos(aim)*560,dy:Math.sin(aim)*560,life:0.7,from:1});
  sfx(600,120,0.09,'square',0.06);
  addHeat(0.08);
}
function aimAngle(){
  if(mouse.active&&!isTouch){
    const px=W/2+(player.car?player.car.x:player.x-cam.x)*zoom;
    const py=H/2+(player.car?player.car.y:player.y-cam.y)*zoom;
    return Math.atan2(mouse.y*DPR-py,mouse.x*DPR-px);
  }
  return player.angle;
}

/* ============================ UPDATE ============================ */
function damagePlayer(d){
  if(player.inv>0||player.dead)return;
  player.hp-=d;
  if(player.hp<=0){player.hp=0;wasted();}
}
function wasted(){
  player.dead=true;player.deadT=0;player.inv=99;
  player.money=Math.max(0,player.money-(200+((Math.random()*300)|0)));
  sfx(300,40,1.2,'sawtooth',0.12);
}
function respawn(){
  player.dead=false;player.hp=100;player.inv=3;heat=0;player.car=null;
  const p=randSidewalkPoint(player.x,player.y,600);
  player.x=p.nx;player.y=p.ny;
  for(let i=cars.length-1;i>=0;i--)if(cars[i].isCop)cars.splice(i,1);
  mission=null;
}
function killPed(p){
  p.dead=1;splats.push({x:p.x,y:p.y,r:10+Math.random()*8});
  if(splats.length>120)splats.shift();
  for(let i=0;i<8;i++)parts.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*160,vy:(Math.random()-0.5)*160,life:0.5,col:'#a11'});
  if(peds.some(q=>!q.dead)&&Math.random()<1)addHeat(1);
  sfx(150,60,0.2,'triangle',0.07);
}
function killCar(c,byPlayer){
  c.dead=2;c.burn=gameT;
  for(let i=0;i<14;i++)parts.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*260,vy:(Math.random()-0.5)*260,life:0.7,col:'#f80',big:1});
  if(c.isCop&&byPlayer)addHeat(1.2);
  sfx(80,30,0.5,'sawtooth',0.12);
}

function update(dt){
  gameT+=dt;
  player.inv=Math.max(0,player.inv-dt);
  player.fireT-=dt;

  /* --- player --- */
  if(player.dead){
    player.deadT+=dt;
    if(player.deadT>3.4)respawn();
  }else{
    let mx=0,my=0,thr=0,str=0;
    if(keys.KeyW||keys.ArrowUp)thr+=1;
    if(keys.KeyS||keys.ArrowDown)thr-=1;
    if(keys.KeyA||keys.ArrowLeft)str-=1;
    if(keys.KeyD||keys.ArrowRight)str+=1;
    if(touch.active){thr+=clamp(-touch.my,-1,1);str+=clamp(touch.mx,-1,1);}
    if(keys.Space||touch.fire||mouse.down)fire();
    if(player.car){
      const c=player.car;
      c.speed+=thr*300*dt;
      c.speed*=(1-1.4*dt);
      c.speed=clamp(c.speed,-140,340);
      c.angle+=str*3.1*dt*clamp(c.speed/110,-1,1);
      const nx=c.x+Math.cos(c.angle)*c.speed*dt,ny=c.y+Math.sin(c.angle)*c.speed*dt;
      c.x=nx;c.y=ny;
      collideBuildings(c,20)&&(c.speed*=-0.35);
      c.x=clamp(c.x,10,WORLD-10);c.y=clamp(c.y,10,WORLD-10);
      player.x=c.x;player.y=c.y;player.angle=c.angle;
      addCarHits(c,1);
    }else{
      const m=Math.hypot(thr,str),ms=Math.min(1,m);
      if(ms>0.05){
        const a=Math.atan2(thr,str);
        player.angle=angLerp(player.angle,a,0.25);
        player.x+=Math.cos(a)*200*ms*dt;
        player.y+=Math.sin(a)*200*ms*dt;
      }
      collideBuildings(player,10);
      player.x=clamp(player.x,8,WORLD-8);player.y=clamp(player.y,8,WORLD-8);
    }
  }

  if(player.car&&player.car.dead){player.car=null;player.hp=Math.min(player.hp,60);}
  if(gameT-lastCrime>6)heat=Math.max(0,heat-0.06*dt);

  /* --- traffic --- */
  const desiredPeds=38,desiredCars=24;
  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i];
    if(c===player.car)continue;
    if(c.dead===2){if(gameT-c.burn>2.5)cars.splice(i,1);continue;}
    if(!c.isCop&&dist2(c.x,c.y,player.x,player.y)>1500*1500){
      // recycle far non-cop cars
      const nc=spawnCar(false,0);
      if(nc){fixCarDir(nc);cars[i]=nc;continue;}
    }
    if(c.driven)continue;
    if(c.isCop){
      // chase player
      const tgt=copsNeeded()>0?{x:player.x,y:player.y}:null;
      if(tgt){
        const ta=Math.atan2(tgt.y-c.y,tgt.x-c.x);
        c.angle=angLerp(c.angle,ta,2.2*dt);
        const dd=dist(c.x,c.y,tgt.x,tgt.y);
        const want=dd>120?230:60;
        c.speed=lerp(c.speed,want,2*dt);
      }else{
        c.speed=lerp(c.speed,0,2*dt);
        if(copsNeeded()===0&&c.speed<8&&dist2(c.x,c.y,player.x,player.y)>900*900){cars.splice(i,1);continue;}
      }
      // cop shooting at 2+ stars
      if(copsNeeded()>=2&&!player.dead){
        c.shootT=(c.shootT||0)-dt;
        const dd=dist(c.x,c.y,player.x,player.y);
        if(c.shootT<=0&&dd<360){
          c.shootT=1.4-Math.min(0.9,copsNeeded()*0.15);
          const aim=Math.atan2(player.y-c.y,player.x-c.x)+(Math.random()-0.5)*0.25;
          bullets.push({x:c.x+Math.cos(aim)*26,y:c.y+Math.sin(aim)*26,dx:Math.cos(aim)*520,dy:Math.sin(aim)*520,life:0.8,from:0});
          sfx(500,140,0.07,'square',0.03);
        }
      }
      addCarHits(c,0);
      c.x+=Math.cos(c.angle)*c.speed*dt;c.y+=Math.sin(c.angle)*c.speed*dt;
      collideBuildings(c,20);
    }else{
      driveLaneCar(c,dt);
      addCarHits(c,0);
    }
    c.turnCd-=dt;
    // hit player on foot?
    if(!player.car&&!player.dead&&dist2(c.x,c.y,player.x,player.y)<28*28&&Math.abs(c.speed)>40){
      damagePlayer(18);c.speed*=0.5;
    }
  }
  // maintain cop count + traffic
  copSpawnT-=dt;
  if(copSpawnT<=0){
    copSpawnT=2.2;
    const need=copsNeeded();
    let copCount=0;for(const c of cars)if(c.isCop&&!c.driven)copCount++;
    if(need>copCount&&need>0){
      for(let t=0;t<10;t++){
        const c=spawnCar(true,1);
        if(c&&dist(c.x,c.y,player.x,player.y)>500){
          fixCarDir(c);c.max=260;cars.push(c);break;
        }
      }
    }
  }
  let carCount=0;for(const c of cars)if(!c.isCop&&!c.driven&&!c.dead)carCount++;
  if(carCount<desiredCars){const c=spawnCar(false,0);if(c){fixCarDir(c);cars.push(c);}}

  /* --- peds --- */
  let pedCount=0;for(const p of peds)if(!p.dead)pedCount++;
  for(let i=peds.length-1;i>=0;i--){
    const p=peds[i];
    if(p.dead){if(gameT-(p.deadT||0)>25)peds.splice(i,1);continue;}
    p.t-=dt;
    if(dist2(p.x,p.y,player.x,player.y)>1400*1400){const np=spawnPed();if(np)peds[i]=np;continue;}
    const hx=p.x+Math.cos(p.a)*p.spd*0.4,hy=p.y+Math.sin(p.a)*p.spd*0.4;
    let ok=true;
    // peds walk anywhere except into buildings; prefer sidewalks
    if(p.t<=0){p.a+= (Math.random()<0.5?1:-1)*Math.PI/2;p.t=1+Math.random()*3;}
    if(copsNeeded()>=1&&dist2(p.x,p.y,player.x,player.y)<200*200){p.panic=Math.min(1,(p.panic||0)+dt);}
    else p.panic=Math.max(0,(p.panic||0)-dt);
    const spd=p.spd*(1+p.panic*1.6);
    let nx=p.x+Math.cos(p.a)*spd*dt,ny=p.y+Math.sin(p.a)*spd*dt;
    const probe={x:nx,y:ny};
    if(collideBuildings(probe,8)){p.a+=Math.PI/2*(Math.random()<0.5?1:-1);p.t=1+Math.random()*2;}
    else{p.x=nx;p.y=ny;}
    // run over check
    for(const c of cars){
      if(c.dead||c.speed===0)continue;
      if(dist2(c.x,c.y,p.x,p.y)<(Math.abs(c.speed)>60?26*26:22*22)&&Math.abs(c.speed)>60){
        killPed(p);
        if(c===player.car){addHeat(1);player.money+=0;player.hp=Math.min(100,player.hp);}
        else if(c.isCop)c.speed*=0.6;
        break;
      }
    }
    // player melee bump steals small money? no. pickups:
    for(let k=pickups.length-1;k>=0;k--){
      const q=pickups[k];
      if(dist2(q.x,q.y,p.x,p.y)<16*16){q.q=1;}
    }
  }
  if(pedCount<desiredPeds){const p=spawnPed();if(p)peds.push(p);}

  /* --- pickups --- */
  for(let k=pickups.length-1;k>=0;k--){
    const q=pickups[k];
    q.t+=dt;
    const px=player.x,py=player.y;
    if(dist2(q.x,q.y,px,py)<(30*30)){
      player.money+=q.val;
      pickups.splice(k,1);
      sfx(880,1320,0.12,'sine',0.06);
      const np=randSidewalkPoint(player.x,player.y,1400);
      pickups.push({x:np.nx,y:np.ny,t:rnd()*TAU,val:50+((rnd()*5)|0)*50});
    }
  }

  /* --- bullets --- */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.dx*dt;b.y+=b.dy*dt;b.life-=dt;
    const pt={x:b.x,y:b.y};
    let dead=b.life<=0;
    if(!dead&&(collideBuildings(pt,2)||b.x<0||b.y<0||b.x>WORLD||b.y>WORLD))dead=true;
    if(!dead){
      if(b.from===1){
        for(const p of peds)if(!p.dead&&dist2(p.x,p.y,b.x,b.y)<14*14){killPed(p);dead=true;break;}
        if(!dead)for(const c of cars){
          if(c.dead)continue;
          if(c===player.car)continue;
          if(dist2(c.x,c.y,b.x,b.y)<24*24){c.hp-=8;if(c.hp<=0)killCar(c,true);else if(c.isCop)addHeat(0.25);dead=true;break;}
        }
      }else{
        if(!player.dead&&dist2(player.x,player.y,b.x,b.y)<(player.car?26:14)*(player.car?26:14)){
          if(player.car){player.car.hp-=3;if(player.car.hp<=0&&!player.car.dead)killCar(player.car,false);}
          else damagePlayer(6);
          dead=true;
        }
      }
    }
    if(dead)bullets.splice(i,1);
  }

  /* --- particles --- */
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.92;q.vy*=0.92;q.life-=dt;
    if(q.life<=0)parts.splice(i,1);
  }

  /* --- mission --- */
  if(!mission){
    if(dist2(player.x,player.y,missionStart.x,missionStart.y)<44*44){
      // pick destination
      const p=randSidewalkPoint(player.x,player.y,1200+((rnd()*2)|0)*600);
      const d=dist(player.x,player.y,p.nx,p.ny);
      const reward=300+Math.round(d/6);
      mission={x:p.nx,y:p.ny,time:16+d/170,total:16+d/170,reward};
      sfx(600,1000,0.25,'sine',0.07);
    }
  }else{
    mission.time-=dt;
    if(dist2(player.x,player.y,mission.x,mission.y)<40*40){
      player.money+=mission.reward;deliveries++;
      mission=null;sfx(700,1400,0.4,'sine',0.08);
    }else if(mission.time<=0){
      mission=null;sfx(300,120,0.4,'sawtooth',0.06);
    }
  }

  /* --- camera --- */
  const fx=player.car?player.car.x+Math.cos(player.car.angle)*player.car.speed*0.25:player.x;
  const fy=player.car?player.car.y+Math.sin(player.car.angle)*player.car.speed*0.25:player.y;
  cam.x=lerp(cam.x,fx,1-Math.pow(0.001,dt));
  cam.y=lerp(cam.y,fy,1-Math.pow(0.001,dt));
}

function addCarHits(c,byPlayer){
  for(const o of cars){
    if(o===c||o.dead||c.dead)continue;
    const d2v=dist2(c.x,c.y,o.x,o.y);
    if(d2v<40*40){
      const d=Math.sqrt(d2v)||1;
      const nx=(c.x-o.x)/d,ny=(c.y-o.y)/d;
      const push=(40-d)/2;
      c.x+=nx*push;c.y+=ny*push;o.x-=nx*push;o.y-=ny*push;
      const rv=Math.abs(c.speed-o.speed);
      c.speed*=0.72;o.speed*=0.9;
      c.hp-=rv*0.02;o.hp-=rv*0.02;
      if(c.hp<=0&&!c.dead)killCar(c,o===player.car);
      if(o.hp<=0&&!o.dead)killCar(o,c===player.car);
      if(byPlayer&&o.isCop)addHeat(0.5);
      if(byPlayer&&rv>60)damagePlayer(2);
      sfx(120,60,0.1,'sawtooth',0.03);
    }
  }
}

/* lane-based traffic AI */
function driveLaneCar(c,dt){
  const axis=c.d%2===0?'x':'y';
  const lane=lanePerp(c.d);
  let roadCenter;
  if(axis==='x')roadCenter=(Math.floor(c.y/PITCH))*PITCH+ROAD/2;
  else roadCenter=(Math.floor(c.x/PITCH))*PITCH+ROAD/2;
  const latTarget=roadCenter+lane.off*(axis==='x'?1:1);
  if(axis==='x'){c.y=lerp(c.y,latTarget,3*dt);}else{c.x=lerp(c.x,latTarget,3*dt);}
  // obstacle ahead
  let blocked=false;
  const fx=c.x+DIRX[c.d]*90,fy=c.y+DIRY[c.d]*90;
  for(const o of cars){
    if(o===c||o.dead)continue;
    if(dist2(fx,fy,o.x,o.y)<38*38){blocked=true;break;}
  }
  if(!player.car&&!player.dead&&dist2(fx,fy,player.x,player.y)<30*30)blocked=true;
  if(player.car&&!player.car.dead&&dist2(fx,fy,player.car.x,player.car.y)<40*40)blocked=true;
  for(const p of peds){
    if(p.dead)continue;
    if(dist2(fx,fy,p.x,p.y)<26*26){blocked=true;break;}
  }
  const want=blocked?0:c.max;
  c.speed=lerp(c.speed,want,blocked?1:clamp(dt*1.2,0,1));
  c.x+=DIRX[c.d]*c.speed*dt;c.y+=DIRY[c.d]*c.speed*dt;
  c.x=clamp(c.x,ROAD/2,WORLD-ROAD/2);c.y=clamp(c.y,ROAD/2,WORLD-ROAD/2);
  c.angle=[0,Math.PI/2,Math.PI,-Math.PI/2][c.d];
  // junction turning
  const along=axis==='x'?c.x:c.y;
  const k=Math.floor(along/PITCH);
  const jCenter=k*PITCH+ROAD/2;
  const inbound=c.d===0||c.d===1;
  const past=inbound?(along>jCenter-4):(along<jCenter+4);
  if(c.turnCd<=0&&past){
    c.turnCd=1.2;
    if(Math.random()<0.45||along<ROAD+50||along>WORLD-ROAD-50){
      let nd;
      const goLeft=Math.random()<0.5;
      if(c.d===0)nd=goLeft?1:3;
      else if(c.d===2)nd=goLeft?3:1;
      else if(c.d===1)nd=goLeft?2:0;
      else nd=goLeft?0:2;
      // snap to intersection center
      if(axis==='x'){c.x=jCenter;}
      else{c.y=jCenter;}
      // position on new road: set lateral of new axis to nearest road center
      if(nd===0||nd===2){c.y=Math.floor(c.y/PITCH)*PITCH+ROAD/2;}
      else{c.x=Math.floor(c.x/PITCH)*PITCH+ROAD/2;}
      c.d=nd;
      const ln=lanePerp(c.d);
      if(ln.axis==='x')c.x+=ln.off*1;else c.y+=ln.off*1;
    }
  }
}

/* ============================ RENDER ============================ */
function brightness(){
  const t=(gameT%DAY_LEN)/DAY_LEN; // 0=midnight
  const day=clamp((Math.sin((t-0.25)*TAU)+0.5)*1.6,0,1);
  return{L:0.32+0.68*clamp(day,0,1),night:1-clamp(day,0,1),t};
}
function shade(col,f){
  const n=parseInt(col.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(r*f|0,0,255);g=clamp(g*f|0,0,255);b=clamp(b*f|0,0,255);
  return`rgb(${r},${g},${b})`;
}
function drawCar(c,night){
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle);
  const col=c.isCop?'#3a6fd8':(c.col||'#888');
  ctx.fillStyle=c.dead?shade('#333',1):col;
  if(c.dead)ctx.fillStyle='#30302c';
  rr(-c.w/2,-c.h/2,c.w,c.h,6);ctx.fill();
  ctx.fillStyle=shade(c.dead?'#222':col,0.7);
  rr(-c.w/2+7,-c.h/2+2,c.w/2+4,c.h-4,5);ctx.fill();
  ctx.fillStyle=shade('#9fd',0.6+0.4*(1-night));
  rr(-4,-c.h/2+3,7,c.h-6,2);ctx.fill();
  if(c.isCop){
    ctx.fillStyle='#fff';ctx.fillRect(-c.w/2+3,-3,4,6);
    const fl=(gameT*8|0)%2===0;
    ctx.fillStyle=fl?'#ff3':'#39f';
    ctx.fillRect(-2,-c.h/2-2,5,4);ctx.fillRect(-2,c.h/2-2,5,4);
  }
  ctx.fillStyle='rgba(255,240,180,0.9)';
  ctx.fillRect(c.w/2-3,-c.h/2+3,3,5);ctx.fillRect(c.w/2-3,c.h/2-8,3,5);
  ctx.restore();
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawPed(p){
  ctx.save();ctx.translate(p.x,p.y);
  if(p.dead){
    ctx.rotate(p.a);
    ctx.fillStyle='#811';rr(-8,-4,16,8,3);ctx.fill();
    ctx.fillStyle=p.col;ctx.fillRect(2,-4,9,8);
    ctx.restore();return;
  }
  ctx.rotate(p.a);
  ctx.fillStyle=p.col;ctx.beginPath();ctx.ellipse(0,0,7,5.5,0,0,TAU);ctx.fill();
  ctx.fillStyle=skin[(p.x*7|0)%4];
  ctx.beginPath();ctx.arc(3,0,3.4,0,TAU);ctx.fill();
  ctx.restore();
}
function drawPlayer(){
  const px=player.car?player.car.x:player.x,py=player.car?player.car.y:player.y;
  if(player.car)return;
  ctx.save();ctx.translate(px,py);ctx.rotate(player.angle);
  if(player.inv>0&&!player.dead&&(gameT*10|0)%2===0)ctx.globalAlpha=0.4;
  ctx.fillStyle=player.dead?'#611':'#134a8b';
  rr(-7,-6,14,12,4);ctx.fill();
  ctx.fillStyle='#e8c69f';ctx.beginPath();ctx.arc(3,0,4,0,TAU);ctx.fill();
  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(6,2);ctx.lineTo(13,2);ctx.stroke();
  ctx.restore();
}
function render(){
  const{L,night,t}=brightness();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#22201d';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-cam.x,-cam.y);
  const vw=W/zoom/2+80,vh=H/zoom/2+80;
  const cx0=Math.max(0,cam.x-vw),cx1=Math.min(WORLD,cam.x+vw),cy0=Math.max(0,cam.y-vh),cy1=Math.min(WORLD,cam.y+vh);

  /* roads + blocks */
  const i0=Math.max(0,Math.floor(cx0/PITCH)-1),i1=Math.min(BLOCKS,Math.floor(cx1/PITCH)+1);
  const j0=Math.max(0,Math.floor(cy0/PITCH)-1),j1=Math.min(BLOCKS,Math.floor(cy1/PITCH)+1);
  ctx.fillStyle=shade('#3a3a3c',1);
  for(let i=i0;i<=i1;i++)ctx.fillRect(i*PITCH,cy0,ROAD,cy1-cy0);
  for(let j=j0;j<=j1;j++)ctx.fillRect(cx0,j*PITCH,cx1-cx0,ROAD);
  // blocks (sidewalks)
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){
    ctx.fillStyle=shade('#9c9789',1);
    ctx.fillRect(i*PITCH+ROAD,j*PITCH+ROAD,BLOCK,BLOCK);
  }
  // lane dashes
  ctx.strokeStyle='rgba(240,220,120,0.5)';ctx.lineWidth=3;ctx.setLineDash([26,26]);
  ctx.beginPath();
  for(let i=i0;i<=i1;i++){ctx.moveTo(i*PITCH+ROAD/2,cy0);ctx.lineTo(i*PITCH+ROAD/2,cy1);}
  for(let j=j0;j<=j1;j++){ctx.moveTo(cx0,j*PITCH+ROAD/2);ctx.lineTo(cx1,j*PITCH+ROAD/2);}
  ctx.stroke();ctx.setLineDash([]);

  /* splats */
  for(const s of splats){ctx.fillStyle='rgba(120,10,10,0.55)';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();}

  /* pickups */
  for(const q of pickups){
    if(q.x<cx0||q.x>cx1||q.y<cy0||q.y>cy1)continue;
    const bob=Math.sin(q.t*4)*3;
    ctx.fillStyle='#2c7a2c';rr(q.x-7,q.y-8+bob,14,16,3);ctx.fill();
    ctx.fillStyle='#9f9';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('$',q.x,q.y+4+bob);
  }
  /* mission markers */
  if(!mission&&nearView(missionStart)){missionRing(missionStart.x,missionStart.y,'#31d158','KURIER');}
  if(mission&&nearView(mission)){missionRing(mission.x,mission.y,'#ffd23c','CEL');}

  /* particles */
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.col;ctx.fillRect(q.x-(q.big?4:2),q.y-(q.big?4:2),q.big?8:4,q.big?8:4);}
  ctx.globalAlpha=1;

  /* peds & cars */
  for(const p of peds){
    if(p.x<cx0-40||p.x>cx1+40||p.y<cy0-40||p.y>cy1+40)continue;
    drawPed(p);
  }
  for(const c of cars){
    if(c.x<cx0-60||c.x>cx1+60||c.y<cy0-60||c.y>cy1+60)continue;
    drawCar(c,night);
  }
  drawPlayer();

  /* bullets */
  ctx.strokeStyle='#ffe9a0';ctx.lineWidth=2.5;
  for(const b of bullets){ctx.globalAlpha=clamp(b.life*4,0,1);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.dx*0.018,b.y-b.dy*0.018);ctx.stroke();}
  ctx.globalAlpha=1;

  /* ============ pseudo-3D buildings ============ */
  const K=0.00110;
  const vis=[];
  for(const b of buildings){
    if(b.x+b.w<cx0-40||b.x>cx1+40||b.y+b.h<cy0-40||b.y>cy1+40)continue;
      vis.push({b,d:dist2(b.x+b.w/2,b.y+b.h/2,cam.x,cam.y)});
  }
  vis.sort((a,b)=>b.d-a.d);
  for(const v of vis){const b=v.b;
    const hK=b.hgt*K;
    const x2=b.x+b.w,y2=b.y+b.h;
    const corners=[[b.x,b.y],[x2,b.y],[x2,y2],[b.x,y2]];
    const tops=corners.map(([x,y])=>[x+(x-cam.x)*hK*zoom,y+(y-cam.y)*hK*zoom]);
    // walls: edge i from corners[i] to corners[(i+1)%4]
    const normals=[[-0,-1],[1,0],[0,1],[-1,0]];
    for(let e=0;e<4;e++){
      const A=corners[e],B=corners[(e+1)%4],TA=tops[(e+1)%4],TB=tops[e];
      const mid=[(A[0]+B[0])/2,(A[1]+B[1])/2];
      const outx=mid[0]-cam.x,outy=mid[1]-cam.y;
      if(normals[e][0]*outx+normals[e][1]*outy<=0)continue;
      const sh=e===0?0.62:e===2?0.55:0.78;
      ctx.fillStyle=shade(b.col,sh*L);
      ctx.beginPath();
      ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);
      ctx.lineTo(TA[0],TA[1]);ctx.lineTo(TB[0],TB[1]);
      ctx.closePath();ctx.fill();
      // windows on this wall
      const len=Math.hypot(B[0]-A[0],B[1]-A[1]);
      const wallH=Math.hypot(TB[0]-A[0],TB[1]-A[1]);
      if(len>50&&wallH>22){
        const n=Math.min(10,Math.floor(len/34));
        for(let wi=0;wi<n;wi++)for(const f of[0.35,0.7]){
          const lit=hash1(b.x|0,b.y|0,wi*3+(f>0.5?100:37))<(night*0.75);
          const ax=lerp(A[0],B[0],(wi+0.5)/n),ay=lerp(A[1],B[1],(wi+0.5)/n);
          const by2=lerp(ay,TB[1],f),bx2=lerp(ax,TB[0],f);
          ctx.fillStyle=lit?`rgba(255,230,140,${0.35+0.65*night})`:shade(b.col,sh*L*0.55);
          ctx.fillRect(bx2-3,by2-3,6,6);
        }
      }
    }
    // roof
    ctx.fillStyle=shade(b.col,L);
    ctx.beginPath();ctx.moveTo(tops[0][0],tops[0][1]);
    for(let e=1;e<4;e++)ctx.lineTo(tops[e][0],tops[e][1]);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=shade(b.col,L*0.5);ctx.lineWidth=2;ctx.stroke();
    // roof AC unit
    const ax=b.x+b.w*0.3,ay=b.y+b.h*0.32;
    const tax=ax+(ax-cam.x)*hK*zoom,tay=ay+(ay-cam.y)*hK*zoom;
    ctx.fillStyle=shade(b.col,L*0.8);
    ctx.fillRect(tax-6,tay-6,12,12);
  }

  /* night overlay */
  ctx.setTransform(1,0,0,1,0,0);
  if(night>0.02){
    ctx.fillStyle=`rgba(8,10,38,${(night*0.52).toFixed(3)})`;
    ctx.fillRect(0,0,W,H);
    // lights (additive) in screen space
    ctx.globalCompositeOperation='lighter';
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-cam.x,-cam.y);
    // street lamps at intersections
    for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){
      const lx=i*PITCH+ROAD/2,ly=j*PITCH+ROAD/2;
      if(lx<cx0-200||lx>cx1+200||ly<cy0-200||ly>cy1+200)continue;
      const g=ctx.createRadialGradient(lx,ly,4,lx,ly,150);
      g.addColorStop(0,`rgba(255,214,140,${0.30*night})`);g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.fillRect(lx-150,ly-150,300,300);
    }
    // headlights
    ctx.fillStyle=`rgba(255,238,180,${0.16*night})`;
    for(const c of cars){
      if(c.dead)continue;
      if(c.x<cx0-200||c.x>cx1+200||c.y<cy0-200||c.y>cy1+200)continue;
      if(c.driven)continue;
      ctx.beginPath();
      ctx.moveTo(c.x+Math.cos(c.angle)*10,c.y+Math.sin(c.angle)*10);
      ctx.lineTo(c.x+Math.cos(c.angle-0.32)*170,c.y+Math.sin(c.angle-0.32)*170);
      ctx.lineTo(c.x+Math.cos(c.angle+0.32)*170,c.y+Math.sin(c.angle+0.32)*170);
      ctx.closePath();ctx.fill();
    }
    ctx.restore();
    ctx.globalCompositeOperation='source-over';
  }

  /* --- HUD --- */
  drawHUD(L,night,t);
  ctx.restore();
}
function nearView(p){return Math.abs(p.x-cam.x)<W/zoom/2+60&&Math.abs(p.y-cam.y)<H/zoom/2+60;}
function missionRing(x,y,col,label){
  const r=26+Math.sin(gameT*4)*4;
  ctx.strokeStyle=col;ctx.lineWidth=4;ctx.globalAlpha=0.9;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();
  ctx.globalAlpha=0.25;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.globalAlpha=1;ctx.fillStyle=col;ctx.font='bold 12px Arial';ctx.textAlign='center';
  ctx.fillText(label,x,y-36);
}
function drawHUD(L,night,t){
  ctx.textAlign='left';
  // health
  ctx.fillStyle='#200';rr(16,16,170,14,7);ctx.fill();
  const grd=ctx.createLinearGradient(0,0,170,0);
  grd.addColorStop(0,'#3fa33f');grd.addColorStop(1,'#8fd88f');
  ctx.fillStyle=grd;rr(18,18,166*clamp(player.hp/100,0,1),10,5);ctx.fill();
  // money
  ctx.font='bold 24px Arial';
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillText('$'+player.money,17,58);
  ctx.fillStyle='#7fe07f';ctx.fillText('$'+player.money,15,56);
  // stars
  ctx.font='20px Arial';
  const stars=Math.floor(heat);
  for(let i=0;i<5;i++){
    ctx.fillStyle=i<stars?'#ffd23c':'rgba(255,255,255,0.18)';
    ctx.fillText('★',245+i*24,30);
  }
  if(heat>0&&heat%1>=0.5){ctx.fillStyle='rgba(255,210,60,0.5)';ctx.fillText('★',255+5*24,30);}
  // clock
  ctx.font='bold 15px Arial';ctx.fillStyle='#fff';
  const hh=Math.floor(t*24),mm=Math.floor((t*24%1)*60);
  ctx.fillText(String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'),255,52);
  ctx.fillStyle=night>0.5?'#9db3ff':'#ffd88f';
  ctx.fillText(night>0.5?' NOC':' DZIEŃ',315,52);
  // mission info
  if(mission){
    ctx.font='bold 13px Arial';
    const left=Math.ceil(mission.time);
    ctx.fillStyle=left<10?'#ff6060':'#ffd23c';
    ctx.fillText('DOWÓZ: '+mission.reward+'$  |  '+left+'s  ('+Math.round(dist(player.x,player.y,mission.x,mission.y))+'m)',16,84);
    // arrow to destination
    const ang=Math.atan2(mission.y-player.y,mission.x-player.x);
    const cx=W/2,cy=H/2,rad=Math.min(W,H)/2-46;
    const ax=cx+Math.cos(ang)*rad*0.8,ay=cy+Math.sin(ang)*rad*0.8;
    ctx.save();ctx.translate(ax,ay);ctx.rotate(ang);
    ctx.fillStyle='#ffd23c';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-9);ctx.lineTo(-8,9);ctx.closePath();ctx.fill();
    ctx.restore();
  }else{
    ctx.font='bold 13px Arial';ctx.fillStyle='#31d158';
    const d=Math.round(dist(player.x,player.y,missionStart.x,missionStart.y));
    ctx.fillText('KURIER: dojedź do zielonego punktu ('+d+'m) by podjąć zlecenie',16,84);
  }
  // deliveries
  ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='bold 12px Arial';
  ctx.fillText('dostawy: '+deliveries,16,104);

  /* minimap */
  const size=150*DPR,mmx=W-size-14*DPR,mmy=14*DPR;
  ctx.save();
  ctx.globalAlpha=0.9;
  ctx.fillStyle='#111';rr(mmx,mmy,size,size,6);ctx.fill();
  ctx.beginPath();ctx.rect(mmx,mmy,size,size);ctx.clip();
  const sc=size/WORLD;
  ctx.translate(mmx,mmy);
  ctx.fillStyle='#3a3a3c';ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#6b675c';
  for(let i=0;i<BLOCKS;i++)for(let j=0;j<BLOCKS;j++)ctx.fillRect((i*PITCH+ROAD)*sc,(j*PITCH+ROAD)*sc,BLOCK*sc,BLOCK*sc);
  const blip=(x,y,col,r)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(x*sc,y*sc,r,0,TAU);ctx.fill();};
  for(const q of pickups)blip(q.x,q.y,'#3d3',1.5*DPR);
  for(const c of cars)if(c.isCop&&!c.dead)blip(c.x,c.y,'#4af',2.5*DPR);
  blip(missionStart.x,missionStart.y,'#31d158',3*DPR);
  if(mission)blip(mission.x,mission.y,'#ffd23c',3.5*DPR);
  blip(player.x,player.y,'#fff',3*DPR);
  // view direction wedge
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=DPR;
  rr(mmx,mmy,size,size,6);ctx.stroke();

  /* WASTED */
  if(player.dead){
    const k=Math.min(1,player.deadT/1.2);
    ctx.fillStyle=`rgba(120,0,0,${0.45*k})`;ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.font=`900 ${Math.floor(16+64*k)*DPR}px Arial`;
    ctx.fillStyle=`rgba(255,60,60,${k})`;
    ctx.fillText('W A S T E D',W/2,H/2);
    ctx.textAlign='left';
  }
  // low hp vignette
  if(player.hp<35&&!player.dead){
    const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.32,W/2,H/2,Math.max(W,H)*0.62);
    const a=0.35*(1-player.hp/35);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(160,0,0,${a})`);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  if(!started){
    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,W,H);
  }
}

/* ============================ LOOP ============================ */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-last)/1000);last=now;
  if(started){
    if(player.dead)dt*=0.3;
    update(dt);
  }
  render();
}
requestAnimationFrame(frame);

document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('intro').style.display='none';
  started=true;
  try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  sfx(440,880,0.2,'sine',0.05);
});
if(isTouch){
  btnFire.style.display='flex';btnEnter.style.display='flex';
}else{
  btnEnter.style.display='flex';
}
})();
</script>
